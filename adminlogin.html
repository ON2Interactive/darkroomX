<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - DarkroomX</title>
    <link rel="icon" type="image/svg+xml" href="/assets/darkroomx-favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="common-page">
    <main class="common-shell">
      <section class="common-blank-section" aria-label="Admin login">
        <div class="common-page-inner">
          <h1>Admin Login</h1>
          <div class="contact-form-wrap">
            <form id="adminLoginForm" class="contact-form" novalidate>
              <label for="adminEmail">Email</label>
              <input id="adminEmail" name="email" type="email" required />

              <label for="adminPassword">Password</label>
              <input id="adminPassword" name="password" type="password" required />

              <button id="adminLoginSubmit" type="submit" class="contact-submit-btn">Sign In</button>
              <p id="adminLoginStatus" class="contact-status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const form = document.getElementById("adminLoginForm");
        const statusEl = document.getElementById("adminLoginStatus");
        const submitBtn = document.getElementById("adminLoginSubmit");
        if (!form || !statusEl || !submitBtn) return;

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const email = String(document.getElementById("adminEmail")?.value || "").trim();
          const password = String(document.getElementById("adminPassword")?.value || "");
          if (!email || !password) {
            statusEl.textContent = "Enter email and password.";
            return;
          }

          submitBtn.disabled = true;
          statusEl.textContent = "Signing in...";
          try {
            const response = await fetch("/api/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              statusEl.textContent = payload?.error || "Sign-in failed.";
              return;
            }
            window.location.href = "/admin";
          } catch {
            statusEl.textContent = "Network error. Please try again.";
          } finally {
            submitBtn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
